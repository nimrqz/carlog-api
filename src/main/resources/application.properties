# =====================================================
# CarLog API - Application Properties
# Sistema de Gerenciamento de Manutencao Veicular
# =====================================================

# --------------------
# Perfil Ativo
# --------------------
# dev  = H2 Database (desenvolvimento)
# prod = PostgreSQL (producao)
spring.profiles.active=dev

# =====================================================
# H2 DATABASE (Desenvolvimento)
# =====================================================
# Banco em memoria para desenvolvimento rapido
# Acesse o console em: http://localhost:8081/h2-console
# -----------------------------------------------------
spring.datasource.url=jdbc:h2:mem:carlogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------
# Console H2
# -----------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================
# SERVER CONFIGURATION
# =====================================================
server.port=8081
server.error.include-message=always
server.error.include-binding-errors=always

# =====================================================
# LOGGING
# =====================================================
# Niveis: TRACE, DEBUG, INFO, WARN, ERROR
# logging.level.org.springframework=INFO
# logging.level.com.carlog=DEBUG

# =====================================================
# JACKSON (JSON)
# =====================================================
# Formato de datas ISO-8601
# spring.jackson.date-format=yyyy-MM-dd
# spring.jackson.time-zone=America/Sao_Paulo
